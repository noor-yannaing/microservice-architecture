spring.application.name=api-gateway
server.port=9000
services.product-url=${PRODUCT_URL:http://localhost:8080}
services.order-url=${ORDER_URL:http://localhost:8081}
services.inventory-url=${INVENTORY_URL:http://localhost:8082}
services.internal-token=${INTERNAL_TOKEN:local-service-token}
security.issuer-uri=${JWT_ISSUER_URI:http://localhost:8181/realms/commerce}
security.jwk-set-uri=${JWT_JWK_SET_URI:http://localhost:8181/realms/commerce/protocol/openid-connect/certs}
spring.cloud.gateway.server.webmvc.http-client.connect-timeout=2s
spring.cloud.gateway.server.webmvc.http-client.read-timeout=5s
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.probes.enabled=true
management.tracing.sampling.probability=${TRACING_SAMPLE_RATE:1.0}
management.otlp.tracing.endpoint=${OTLP_ENDPOINT:http://localhost:4318/v1/traces}
logging.structured.format.console=logstash
