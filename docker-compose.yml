name: commerce
x-application: &application
  restart: unless-stopped
  build:
    context: .
  environment: &common-env
    INTERNAL_TOKEN: ${INTERNAL_TOKEN:-local-service-token}
    OTLP_ENDPOINT: http://tempo:4318/v1/traces
  networks: [commerce]
  healthcheck: &app-health
    test: ["CMD", "sh", "-c", "exec 3<>/dev/tcp/localhost/8080"]
    interval: 15s
    timeout: 5s
    retries: 10
    start_period: 60s

services:
  mongodb:
    image: mongo:7.0.16
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-local-mongo-password}
    ports: ["127.0.0.1:27017:27017"]
    volumes: [mongo-data:/data/db]
    networks: [commerce]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      retries: 15

  order-db:
    image: mysql:8.4.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-local-root-password}
      MYSQL_DATABASE: order_service
      MYSQL_USER: orders
      MYSQL_PASSWORD: orders
    ports: ["127.0.0.1:3306:3306"]
    volumes: [order-data:/var/lib/mysql]
    networks: [commerce]
    healthcheck: &mysql-health
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 20

  inventory-db:
    image: mysql:8.4.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-local-root-password}
      MYSQL_DATABASE: inventory_service
      MYSQL_USER: inventory
      MYSQL_PASSWORD: inventory
    ports: ["127.0.0.1:3307:3306"]
    volumes: [inventory-data:/var/lib/mysql]
    networks: [commerce]
    healthcheck: *mysql-health

  notification-db:
    image: mysql:8.4.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-local-root-password}
      MYSQL_DATABASE: notification_service
      MYSQL_USER: notifications
      MYSQL_PASSWORD: notifications
    ports: ["127.0.0.1:3308:3306"]
    volumes: [notification-data:/var/lib/mysql]
    networks: [commerce]
    healthcheck: *mysql-health

  kafka:
    image: confluentinc/cp-kafka:7.8.0
    hostname: kafka
    ports: ["127.0.0.1:9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 3
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes: [kafka-data:/var/lib/kafka/data]
    networks: [commerce]
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:29092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 20

  schema-registry:
    image: confluentinc/cp-schema-registry:7.8.0
    depends_on:
      kafka: {condition: service_healthy}
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:29092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_SCHEMA_COMPATIBILITY_LEVEL: BACKWARD
    ports: ["127.0.0.1:8085:8081"]
    networks: [commerce]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/subjects"]
      interval: 10s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.1.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-local-admin-password}
      KC_HOSTNAME: http://localhost:8181
      KC_HEALTH_ENABLED: "true"
    ports: ["127.0.0.1:8181:8080"]
    volumes:
      - ./infra/keycloak/commerce-realm.json:/opt/keycloak/data/import/commerce-realm.json:ro
      - keycloak-data:/opt/keycloak/data
    networks: [commerce]

  mailpit:
    image: axllent/mailpit:v1.22.3
    ports: ["127.0.0.1:8025:8025", "127.0.0.1:1025:1025"]
    networks: [commerce]

  product-service:
    <<: *application
    build: {context: ., args: {SERVICE: product-service}}
    environment:
      <<: *common-env
      MONGODB_URI: mongodb://root:${MONGO_PASSWORD:-local-mongo-password}@mongodb:27017/product_service?authSource=admin
    depends_on:
      mongodb: {condition: service_healthy}
    healthcheck:
      <<: *app-health
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8080"]

  inventory-service:
    <<: *application
    build: {context: ., args: {SERVICE: inventory-service}}
    environment:
      <<: *common-env
      DATABASE_URL: jdbc:mysql://inventory-db:3306/inventory_service
    depends_on:
      inventory-db: {condition: service_healthy}
    healthcheck:
      <<: *app-health
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8082"]

  order-service:
    <<: *application
    build: {context: ., args: {SERVICE: order-service}}
    environment:
      <<: *common-env
      DATABASE_URL: jdbc:mysql://order-db:3306/order_service
      PRODUCT_URL: http://product-service:8080
      INVENTORY_URL: http://inventory-service:8082
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
    depends_on:
      order-db: {condition: service_healthy}
      product-service: {condition: service_healthy}
      inventory-service: {condition: service_healthy}
      schema-registry: {condition: service_healthy}
    healthcheck:
      <<: *app-health
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8081"]

  notification-service:
    <<: *application
    build: {context: ., args: {SERVICE: notification-service}}
    environment:
      <<: *common-env
      DATABASE_URL: jdbc:mysql://notification-db:3306/notification_service
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      SMTP_HOST: mailpit
    depends_on:
      notification-db: {condition: service_healthy}
      schema-registry: {condition: service_healthy}
      mailpit: {condition: service_started}
    healthcheck:
      <<: *app-health
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8083"]

  api-gateway:
    <<: *application
    build: {context: ., args: {SERVICE: api-gateway}}
    ports: ["127.0.0.1:9000:9000"]
    environment:
      <<: *common-env
      PRODUCT_URL: http://product-service:8080
      ORDER_URL: http://order-service:8081
      INVENTORY_URL: http://inventory-service:8082
      JWT_JWK_SET_URI: http://keycloak:8080/realms/commerce/protocol/openid-connect/certs
    depends_on:
      keycloak: {condition: service_started}
      product-service: {condition: service_healthy}
      order-service: {condition: service_healthy}
      inventory-service: {condition: service_healthy}
    healthcheck:
      <<: *app-health
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/9000"]

  prometheus:
    image: prom/prometheus:v3.2.1
    profiles: [observability]
    volumes: ["./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro", "prometheus-data:/prometheus"]
    ports: ["127.0.0.1:9090:9090"]
    networks: [commerce]

  tempo:
    image: grafana/tempo:2.7.1
    profiles: [observability]
    command: ["-config.file=/etc/tempo.yml"]
    volumes: ["./infra/tempo/tempo.yml:/etc/tempo.yml:ro", "tempo-data:/var/tempo"]
    ports: ["127.0.0.1:4318:4318"]
    networks: [commerce]

  loki:
    image: grafana/loki:3.4.2
    profiles: [observability]
    command: ["-config.file=/etc/loki/local-config.yaml"]
    networks: [commerce]

  alloy:
    image: grafana/alloy:v1.7.4
    profiles: [observability]
    command: ["run", "/etc/alloy/config.alloy"]
    volumes: ["./infra/alloy/config.alloy:/etc/alloy/config.alloy:ro", "/var/run/docker.sock:/var/run/docker.sock:ro"]
    networks: [commerce]

  grafana:
    image: grafana/grafana:11.6.0
    profiles: [observability]
    ports: ["127.0.0.1:3000:3000"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: local-grafana-password
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    networks: [commerce]

networks:
  commerce:
volumes:
  mongo-data:
  order-data:
  inventory-data:
  notification-data:
  kafka-data:
  keycloak-data:
  prometheus-data:
  tempo-data:
  grafana-data:
