spring.application.name=inventory-service
server.port=8082
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3307/inventory_service}
spring.datasource.username=${DATABASE_USERNAME:inventory}
spring.datasource.password=${DATABASE_PASSWORD:inventory}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
services.internal-token=${INTERNAL_TOKEN:local-service-token}
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.probes.enabled=true
management.tracing.sampling.probability=${TRACING_SAMPLE_RATE:1.0}
management.otlp.tracing.endpoint=${OTLP_ENDPOINT:http://localhost:4318/v1/traces}
logging.structured.format.console=logstash
spring.mvc.problemdetails.enabled=true
