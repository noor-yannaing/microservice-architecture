spring.application.name=notification-service
server.port=8083
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3308/notification_service}
spring.datasource.username=${DATABASE_USERNAME:notifications}
spring.datasource.password=${DATABASE_PASSWORD:notifications}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
services.internal-token=${INTERNAL_TOKEN:local-service-token}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=io.confluent.kafka.serializers.KafkaAvroDeserializer
spring.kafka.consumer.properties.schema.registry.url=${SCHEMA_REGISTRY_URL:http://localhost:8085}
spring.kafka.listener.ack-mode=record
spring.kafka.listener.observation-enabled=true
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:1025}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=3000
spring.mail.properties.mail.smtp.timeout=3000
spring.mail.properties.mail.smtp.writetimeout=3000
notifications.from=${MAIL_FROM:orders@commerce.local}
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.probes.enabled=true
management.tracing.sampling.probability=${TRACING_SAMPLE_RATE:1.0}
management.otlp.tracing.endpoint=${OTLP_ENDPOINT:http://localhost:4318/v1/traces}
logging.structured.format.console=logstash
