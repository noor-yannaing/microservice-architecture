spring.application.name=order-service
server.port=8081
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/order_service}
spring.datasource.username=${DATABASE_USERNAME:orders}
spring.datasource.password=${DATABASE_PASSWORD:orders}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
services.internal-token=${INTERNAL_TOKEN:local-service-token}
services.product-url=${PRODUCT_URL:http://localhost:8080}
services.inventory-url=${INVENTORY_URL:http://localhost:8082}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=io.confluent.kafka.serializers.KafkaAvroSerializer
spring.kafka.producer.properties.schema.registry.url=${SCHEMA_REGISTRY_URL:http://localhost:8085}
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.block.ms=5000
spring.kafka.producer.properties.delivery.timeout.ms=10000
spring.kafka.producer.properties.request.timeout.ms=5000
spring.kafka.template.observation-enabled=true
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.probes.enabled=true
management.tracing.sampling.probability=${TRACING_SAMPLE_RATE:1.0}
management.otlp.tracing.endpoint=${OTLP_ENDPOINT:http://localhost:4318/v1/traces}
logging.structured.format.console=logstash
spring.mvc.problemdetails.enabled=true
spring.task.scheduling.pool.size=2
